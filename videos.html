<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos</title>
    <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
    <div class="toggle-switch">
        <input type="checkbox" id="theme-toggle" class="checkbox" />
        <label for="theme-toggle" class="toggle-label"></label>
    </div>

  <main class="container">
    <h1>🎥 Videos</h1>
    <br/><br/>
    <div class="video-grid">
      <iframe src="https://www.youtube.com/embed/m6lGg5wMOOM" frameborder="0" allowfullscreen   allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ></iframe>
      <iframe src="https://www.youtube.com/embed/YcB2mPXnIsc" frameborder="0" allowfullscreen   allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ></iframe>
   
    </div>
  </main>

 
 <footer class="main-footer">
    
    © 2025 - Team Camarógrafos Arica y Parinacota
</footer>

    <script src="script.js"></script>
</body>
</html>
