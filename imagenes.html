<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imágenes</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .gallery img {
      width: 100%;
      height: 200px; /* Todas las miniaturas tendrán la misma altura */
      object-fit: cover; /* Recorta y ajusta sin deformar */
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.3s;
      cursor: pointer;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Lightbox */
    .lightbox {
      display: none; 
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .lightbox:target {
      display: flex;
    }

    /* Botón de cierre */
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
    <div class="toggle-switch">
        <input type="checkbox" id="theme-toggle" class="checkbox" />
        <label for="theme-toggle" class="toggle-label"></label>
    </div>

  <main class="container">
    <h1>📷 Imágenes</h1>
    <br/><br/>
    <div class="gallery">
      <a href="#img1"><img src="img1.jpg" alt="Foto 1"></a>
      <a href="#img2"><img src="img2.jpg" alt="Foto 2"></a>
      <a href="#img3"><img src="img3.jpeg" alt="Foto 3"></a>
      <a href="#img4"><img src="img4.jpeg" alt="Foto 4"></a>
      <a href="#img5"><img src="img5.jpeg" alt="Foto 5"></a>
       <a href="#img6"><img src="img6.png" alt="Foto 6"></a>
        <a href="#img7"><img src="img7.png" alt="Foto 7"></a>
        <a href="#img8"><img src="img8.png" alt="Foto 8"></a>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="img1" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="img1.jpg" alt="Foto 1">
  </div>
  <div id="img2" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="img2.jpg" alt="Foto 2">
  </div>
  <div id="img3" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="img3.jpeg" alt="Foto 3">
  </div>
  <div id="img4" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="img4.jpeg" alt="Foto 4">
  </div>
  <div id="img5" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="img5.jpeg" alt="Foto 5">
  </div>
   <div id="img6" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="img6.png" alt="Foto 6">
  </div>
   <div id="img7" class="lightbox">
    <a href="#" class="close">&times;</a>
    <img src="img7.png" alt="Foto 7">
  </div>
   <div id="img8" class="lightbox">
    <a href="#" class="close">&times;</a>

</html>
